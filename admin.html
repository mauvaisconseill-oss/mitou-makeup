<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mitou Makeup — Espace admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<section class="admin-login" id="admin-login">
  <div class="admin-login-box">
    <span class="logo">Mitou Makeup</span>
    <p class="admin-login-kicker">Espace admin</p>
    <label>Mot de passe</label>
    <input type="password" id="admin-pass" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-live admin-login-btn" id="admin-login-btn">Entrer →</button>
    <p class="admin-login-err" id="admin-login-err"></p>
  </div>
</section>

<!-- ============ DASHBOARD ============ -->
<div class="admin-dash" id="admin-dash" style="display:none">

  <header class="admin-header">
    <span class="logo">Mitou Makeup <span class="admin-tag">Admin</span></span>
    <div class="admin-header-actions">
      <button class="admin-btn ghost" id="refresh-btn">↻ Actualiser</button>
      <button class="admin-btn ghost" id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <div class="admin-stats" id="admin-stats"></div>

  <div class="admin-filters" id="admin-filters">
    <button class="admin-chip active" data-filter="all">Tout</button>
    <button class="admin-chip" data-filter="slot">Invitée</button>
    <button class="admin-chip" data-filter="formation">Formation</button>
    <button class="admin-chip" data-filter="mariee">Mariée</button>
  </div>

  <main class="admin-board" id="admin-board">
    <section class="admin-col" data-status="en attente">
      <h2 class="admin-col-title">
        <span>En attente</span>
        <span class="admin-col-count" id="count-attente">0</span>
      </h2>
      <div class="admin-col-body" id="col-attente">
        <p class="admin-empty">Aucune demande en attente.</p>
      </div>
    </section>

    <section class="admin-col" data-status="acceptée">
      <h2 class="admin-col-title">
        <span>Acceptées</span>
        <span class="admin-col-count" id="count-acceptee">0</span>
      </h2>
      <div class="admin-col-body" id="col-acceptee">
        <p class="admin-empty">Aucune demande acceptée.</p>
      </div>
    </section>

    <section class="admin-col" data-status="refusée">
      <h2 class="admin-col-title">
        <span>Refusées</span>
        <span class="admin-col-count" id="count-refusee">0</span>
      </h2>
      <div class="admin-col-body" id="col-refusee">
        <p class="admin-empty">Aucune demande refusée.</p>
      </div>
    </section>
  </main>
</div>

<!-- Carte-modèle (clonée en JS, jamais affichée telle quelle) -->
<template id="card-template">
  <article class="admin-card">
    <div class="admin-card-top">
      <span class="admin-card-type"></span>
      <span class="admin-card-total"></span>
    </div>
    <h3 class="admin-card-name"></h3>
    <p class="admin-card-service"></p>
    <div class="admin-card-meta"></div>
    <a class="admin-card-capture" target="_blank" rel="noopener">📎 Voir la capture de paiement</a>
    <div class="admin-card-actions"></div>
  </article>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
